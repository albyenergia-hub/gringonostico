name: Aggiorna risultati

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python aggiorna_risultati.py
      - name: Salva le modifiche
        run: |
          git config user.name "gringonostico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add nuovi_risultati.json
          git diff --cached --quiet || (git commit -m "Aggiorna risultati" && git push)
